<html lang="es"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión </title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&amp;display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #0d6efd;
            --danger-color: #dc3545;
        }

        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            background: linear-gradient(-45deg, #ff0000ff, #cb1717ef, #d46e6eff, #751010ff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 3rem 2.5rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .login-container:hover {
            transform: translateY(-5px);
        }
        
        .login-title {
            font-weight: 700;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
        }

        .form-control {
            background-color: rgba(255, 255, 255, 0.2) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            color: #fff !important;
            border-radius: 0.5rem;
            padding-left: 2.5rem; 
        }

        .form-control::placeholder {
            color: rgba(0, 0, 0, 0.7);
        }

        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.3) !important;
            color: #fff !important;
            border-color: var(--primary-color) !important;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.3);
        }

        .input-group-text {
            background-color: transparent !important;
            border: none !important;
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.8);
        }

        .btn-login {
            font-weight: 600;
            border-radius: 0.5rem;
            padding: 0.75rem;
            background-color: white;
            border-color: white;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-login:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        .alert-custom {
            background: rgba(220, 53, 69, 0.25);
            border: 1px solid rgba(220, 53, 69, 0.5);
            color: #fff;
            border-radius: 0.5rem;
            font-size: 0.9rem;
        }

    </style>
</head>
<body>
    
<div class="login-container animate__animated animate__fadeInUp">
    <form method="POST" action="">
        <div class="text-center mb-4">
             <h1 class="h3 mb-3 login-title">Bienvenido</h1>
        </div>

        
        <div class="position-relative mb-3">
            <i class="fa fa-user input-group-text"></i>
            <input type="text" name="usuario" class="form-control" placeholder="Usuario" required="" autocomplete="username">
        </div>
        
        <div class="position-relative mb-4">
            <i class="fa fa-lock input-group-text"></i>
            <input type="password" name="password" class="form-control" placeholder="Contraseña" required="" autocomplete="current-password">
        </div>
        
        <button type="submit" class="btn btn-login w-100">
            <i class="fa-solid fa-right-to-bracket me-2"></i>Iniciar 
        </button>
    </form>
</div>

<script>
    window.addEventListener("pageshow", function(event) {
        var historyTraversal = event.persisted || 
                               (typeof window.performance != "undefined" && 
                                window.performance.navigation.type === 2);
        if (historyTraversal) {
            window.location.reload(true);
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body></html>
